<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">EV charging network research pipeline</title>
  <desc id="desc">A conceptual five-stage flow from a historical charging registry through spatial graphs, network diagnostics, evolutionary search, and retrospective comparison.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13223A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67E8F9"/>
    </marker>
  </defs>

  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1260" cy="-35" r="230" fill="#0EA5E9" opacity="0.08"/>
  <circle cx="85" cy="590" r="240" fill="#22C55E" opacity="0.07"/>

  <text x="70" y="78" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">From registry data to infrastructure planning scenarios</text>
  <text x="70" y="115" fill="#A8B7CC" font-family="Inter, Arial, sans-serif" font-size="18">Conceptual overview of the 2023 MSc research pipeline</text>
  <rect x="70" y="136" width="310" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(70 190)">
      <rect width="220" height="235" rx="18" fill="#172B46" stroke="#2C4768"/>
      <circle cx="42" cy="44" r="22" fill="#0EA5E9" opacity="0.22"/>
      <path d="M29 34h26v20H29z M33 30h18v4H33z M34 39h16 M34 44h16 M34 49h11" fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round"/>
      <text x="24" y="92" fill="#F8FAFC" font-size="19" font-weight="700">Historical registry</text>
      <text x="24" y="124" fill="#A8B7CC" font-size="15">Commissioning dates,</text>
      <text x="24" y="147" fill="#A8B7CC" font-size="15">coordinates and charger</text>
      <text x="24" y="170" fill="#A8B7CC" font-size="15">attributes through 2022</text>
      <text x="24" y="210" fill="#67E8F9" font-size="13" font-weight="700">DATA PREPARATION</text>
    </g>

    <g transform="translate(330 190)">
      <rect width="220" height="235" rx="18" fill="#172B46" stroke="#2C4768"/>
      <circle cx="42" cy="44" r="22" fill="#8B5CF6" opacity="0.22"/>
      <g stroke="#C4B5FD" stroke-width="2">
        <path d="M28 50 39 32 56 38 52 56 35 59Z" fill="none"/>
        <path d="M39 32 52 56 M28 50 56 38"/>
      </g>
      <g fill="#DDD6FE"><circle cx="28" cy="50" r="3"/><circle cx="39" cy="32" r="3"/><circle cx="56" cy="38" r="3"/><circle cx="52" cy="56" r="3"/><circle cx="35" cy="59" r="3"/></g>
      <text x="24" y="92" fill="#F8FAFC" font-size="19" font-weight="700">Annual spatial graphs</text>
      <text x="24" y="124" fill="#A8B7CC" font-size="15">Charging locations become</text>
      <text x="24" y="147" fill="#A8B7CC" font-size="15">nodes in cumulative yearly</text>
      <text x="24" y="170" fill="#A8B7CC" font-size="15">network snapshots</text>
      <text x="24" y="210" fill="#C4B5FD" font-size="13" font-weight="700">GRAPH MODEL</text>
    </g>

    <g transform="translate(590 190)">
      <rect width="220" height="235" rx="18" fill="#172B46" stroke="#2C4768"/>
      <circle cx="42" cy="44" r="22" fill="#F59E0B" opacity="0.22"/>
      <path d="M29 57V35 M29 57h29 M35 51l7-9 7 4 8-13" fill="none" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="92" fill="#F8FAFC" font-size="19" font-weight="700">Network diagnostics</text>
      <text x="24" y="124" fill="#A8B7CC" font-size="15">Topology and geographic</text>
      <text x="24" y="147" fill="#A8B7CC" font-size="15">spread expose competing</text>
      <text x="24" y="170" fill="#A8B7CC" font-size="15">planning priorities</text>
      <text x="24" y="210" fill="#FCD34D" font-size="13" font-weight="700">MEASUREMENT</text>
    </g>

    <g transform="translate(850 190)">
      <rect width="220" height="235" rx="18" fill="#172B46" stroke="#2C4768"/>
      <circle cx="42" cy="44" r="22" fill="#22C55E" opacity="0.22"/>
      <path d="M29 43c5-12 22-14 28-3 M55 33l3 7-8 1 M57 48c-5 12-22 14-28 3 M31 58l-3-7 8-1" fill="none" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="92" fill="#F8FAFC" font-size="19" font-weight="700">Evolutionary search</text>
      <text x="24" y="124" fill="#A8B7CC" font-size="15">A genetic algorithm explores</text>
      <text x="24" y="147" fill="#A8B7CC" font-size="15">alternative placements under</text>
      <text x="24" y="170" fill="#A8B7CC" font-size="15">an explicit weighted objective</text>
      <text x="24" y="210" fill="#86EFAC" font-size="13" font-weight="700">COUNTERFACTUAL SEARCH</text>
    </g>

    <g transform="translate(1110 190)">
      <rect width="220" height="235" rx="18" fill="#172B46" stroke="#2C4768"/>
      <circle cx="42" cy="44" r="22" fill="#EC4899" opacity="0.22"/>
      <path d="M27 34h12v25H27z M46 40h12v19H46z" fill="none" stroke="#F9A8D4" stroke-width="2.5"/>
      <text x="24" y="92" fill="#F8FAFC" font-size="19" font-weight="700">Historical comparison</text>
      <text x="24" y="124" fill="#A8B7CC" font-size="15">Simulated and observed</text>
      <text x="24" y="147" fill="#A8B7CC" font-size="15">next-year networks reveal</text>
      <text x="24" y="170" fill="#A8B7CC" font-size="15">trade-offs, not a universal optimum</text>
      <text x="24" y="210" fill="#F9A8D4" font-size="13" font-weight="700">INTERPRETATION</text>
    </g>
  </g>

  <g stroke="#67E8F9" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path d="M296 307H322"/><path d="M556 307H582"/><path d="M816 307H842"/><path d="M1076 307H1102"/>
  </g>

  <rect x="70" y="465" width="1260" height="56" rx="14" fill="#0F1E32" stroke="#263E5D"/>
  <text x="98" y="500" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="15">ARCHIVAL SCOPE</text>
  <text x="255" y="500" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="15">Historical thesis findings · public portfolio edition · no model retraining or new experimental claims</text>
</svg>
